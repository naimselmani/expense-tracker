function loadReports(){
  const screen=document.getElementById('screen-reports');
  if(!screen.dataset.bound){
    screen.dataset.bound='1';
    document.getElementById('rep-apply').addEventListener('click',()=>{ S.reportFrom=document.getElementById('rep-from').value; S.reportTo=document.getElementById('rep-to').value; fetchReports(); });
    document.getElementById('rep-clear').addEventListener('click',()=>{ S.reportFrom=S.reportTo=''; document.getElementById('rep-from').value=''; document.getElementById('rep-to').value=''; fetchReports(); });
    document.getElementById('rep-pdf').addEventListener('click',exportPDF);
    document.getElementById('rep-csv-filtered').addEventListener('click',()=>{ let e=DB.getExpenses(); if(S.reportFrom) e=e.filter(x=>x.expenseDate>=S.reportFrom); if(S.reportTo) e=e.filter(x=>x.expenseDate<=S.reportTo); exportCSV(e); });
    document.getElementById('rep-csv-all').addEventListener('click',()=>exportCSV(DB.getExpenses()));
    document.getElementById('rep-json').addEventListener('click',()=>{
      const projects=DB.getProjects();
      const allData={version:2,exportedAt:new Date().toISOString(),settings:S.settings,categories:S.categories,projects,expenses:{}};
      projects.forEach(p=>{ allData.expenses[p.id]=DB.getExpenses(p.id); });
      downloadText(JSON.stringify(allData,null,2),'buildtrack-backup-all.json','application/json');
    });
    document.getElementById('rep-import').addEventListener('click',()=>document.getElementById('import-file').click());
    document.getElementById('import-file').addEventListener('change',handleImport);
  }
  if(S.reportFrom) document.getElementById('rep-from').value=S.reportFrom;
  if(S.reportTo)   document.getElementById('rep-to').value=S.reportTo;
  fetchReports();
}

async function handleImport(e){
  const file=e.target.files[0]; if(!file) return;
  try {
    const data=JSON.parse(await file.text());
    const isV2=data.version===2&&data.projects;
    const count=isV2?Object.values(data.expenses||{}).reduce((a,arr)=>a+arr.length,0):(data.expenses||[]).length;
    showConfirm('Restore Backup',`This will REPLACE all current data with ${count} expenses. Are you sure?`,'Restore',()=>{
      if(data.settings) DB.saveSettings(data.settings);
      if(data.categories) DB.saveCategories(data.categories);
      if(isV2){
        if(data.projects) DB.saveProjects(data.projects);
        Object.entries(data.expenses||{}).forEach(([pid,arr])=>DB.saveExpenses(arr,parseInt(pid)));
      } else {
        if(data.expenses) DB.saveExpenses(data.expenses,1);
      }
      S.settings=DB.getSettings(); S.categories=DB.getCategories();
      showToast(`Restored ${count} expenses ✓`,'success'); showScreen('dashboard');
    });
  } catch { showToast('Invalid backup file','error'); }
  e.target.value='';
}

function exportCSV(expenses){
  const project=DB.getActiveProject();
  const BOM='\uFEFF';
  const header='Date;Supplier;Category;Amount EUR;Amount MKD;Currency;Rate;Note';
  const rows=expenses.map(e=>[e.expenseDate,e.supplierName||'',e.category||'',e.amountEUR,e.amountMKD,e.currencyOriginal,e.exchangeRate,(e.note||'').replace(/;/g,'|').replace(/\n/g,' ')].join(';'));
  downloadText(BOM+header+'\n'+rows.join('\n'),`${project?.name||'expenses'}-expenses.csv`,'text/csv;charset=utf-8');
}

function exportPDF(){
  const project=DB.getActiveProject();
  let expenses=DB.getExpenses();
  if(S.reportFrom) expenses=expenses.filter(e=>e.expenseDate>=S.reportFrom);
  if(S.reportTo)   expenses=expenses.filter(e=>e.expenseDate<=S.reportTo);
  expenses.sort((a,b)=>(b.expenseDate||'')>(a.expenseDate||'')?1:-1);

  const totalEUR=expenses.reduce((a,e)=>a+(e.amountEUR||0),0);
  const totalMKD=expenses.reduce((a,e)=>a+(e.amountMKD||0),0);
  const budgetLine=project?.budgetEUR>0?`<p style="margin:4px 0;color:#14a865;font-weight:600">Budget: ${fmtEUR(project.budgetEUR)} · Remaining: ${fmtEUR(project.budgetEUR-totalEUR)}</p>`:'';
  const dateRange=S.reportFrom||S.reportTo?`${S.reportFrom?fmtDate(S.reportFrom):'Start'} — ${S.reportTo?fmtDate(S.reportTo):'Today'}`:'All time';

  const rows=expenses.map((e,i)=>`
    <tr style="background:${i%2===0?'#fff':'#f8fafc'}">
      <td>${fmtDate(e.expenseDate)}</td>
      <td>${esc(e.supplierName||'—')}</td>
      <td>${esc(e.category||'—')}</td>
      <td style="text-align:right;font-weight:600">${fmtEUR(e.amountEUR)}</td>
      <td style="text-align:right;color:#64748b">${fmtMKD(e.amountMKD)}</td>
      <td>${esc(e.note||'')}</td>
    </tr>`).join('');

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(project?.name||'BuildTrack')} — Expense Report</title>
  <style>
    body{font-family:'Inter',Arial,sans-serif;font-size:13px;color:#0d1520;margin:0;padding:24px}
    h1{font-size:22px;font-weight:800;color:#0d1520;margin:0 0 4px}
    .subtitle{font-size:14px;color:#4a5568;margin-bottom:16px}
    .summary{background:#edfaf3;border:1px solid #b8f0d6;border-radius:8px;padding:12px 16px;margin-bottom:20px}
    .summary p{margin:3px 0;font-size:14px}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th{background:#1ec97e;color:#fff;padding:8px 10px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
    td{padding:7px 10px;border-bottom:1px solid #e2e8f0;vertical-align:top}
    tfoot td{font-weight:800;font-size:13px;background:#f4f6f9;border-top:2px solid #1ec97e}
    @media print{body{padding:0}@page{margin:15mm}}
  </style></head><body>
  <h1>🏗️ ${esc(project?.name||'BuildTrack')}</h1>
  <div class="subtitle">Expense Report · ${esc(dateRange)} · Generated ${new Date().toLocaleDateString()}</div>
  <div class="summary">
    <p><strong>${expenses.length} expenses</strong> in period</p>
    <p style="font-size:16px;font-weight:800;color:#14a865">Total: ${fmtEUR(totalEUR)} &nbsp;·&nbsp; ${fmtMKD(totalMKD)}</p>
    ${budgetLine}
  </div>
  <table>
    <thead><tr><th>Date</th><th>Supplier</th><th>Category</th><th style="text-align:right">EUR</th><th style="text-align:right">MKD</th><th>Note</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="3">TOTAL</td><td style="text-align:right">${fmtEUR(totalEUR)}</td><td style="text-align:right">${fmtMKD(totalMKD)}</td><td></td></tr></tfoot>
  </table>
  </body></html>`;

  const win=window.open('','_blank');
  win.document.write(html);
  win.document.close();
  win.onload=()=>{ win.focus(); setTimeout(()=>win.print(),300); };
}

function fetchReports(){
  let expenses=DB.getExpenses();
  const project=DB.getActiveProject();
  if(S.reportFrom) expenses=expenses.filter(e=>e.expenseDate>=S.reportFrom);
  if(S.reportTo)   expenses=expenses.filter(e=>e.expenseDate<=S.reportTo);

  const totalEUR=expenses.reduce((a,e)=>a+(e.amountEUR||0),0);
  const totalMKD=expenses.reduce((a,e)=>a+(e.amountMKD||0),0);
  const now=new Date(); const thisMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const monthExp=expenses.filter(e=>e.expenseDate&&e.expenseDate.startsWith(thisMonth));
  const monthEUR=monthExp.reduce((a,e)=>a+(e.amountEUR||0),0);

  const budgetStat=project?.budgetEUR>0?`
    <div class="rep-stat full">
      <div class="rep-stat-label">Budget vs Spent</div>
      <div class="rep-stat-val">${fmtEUR(project.budgetEUR-totalEUR)}</div>
      <div class="rep-stat-sub">Remaining of ${fmtEUR(project.budgetEUR)} budget</div>
    </div>`:'';

  document.getElementById('rep-summary').innerHTML=`
    <div class="rep-stat"><div class="rep-stat-label">Total EUR</div><div class="rep-stat-val">${fmtEUR(totalEUR)}</div><div class="rep-stat-sub">${expenses.length} entries</div></div>
    <div class="rep-stat"><div class="rep-stat-label">Total MKD</div><div class="rep-stat-val" style="font-size:16px">${fmtMKD(totalMKD)}</div></div>
    <div class="rep-stat full"><div class="rep-stat-label">This Month</div><div class="rep-stat-val">${fmtEUR(monthEUR)}</div></div>
    ${budgetStat}`;

  const catMap={};
  expenses.forEach(e=>{ const k=e.category||'Other'; catMap[k]=catMap[k]||{totalEUR:0,totalMKD:0,count:0}; catMap[k].totalEUR+=e.amountEUR||0; catMap[k].totalMKD+=e.amountMKD||0; catMap[k].count++; });
  const cats=Object.entries(catMap).sort((a,b)=>b[1].totalEUR-a[1].totalEUR);
  const maxEUR=cats.length?cats[0][1].totalEUR:1;
  document.getElementById('rep-categories').innerHTML=cats.length?cats.map(([name,d])=>{ const m=getCatMeta(name); const pct=Math.round((d.totalEUR/maxEUR)*100); return `<div class="rep-bar-row"><div class="rep-bar-head"><span class="rep-bar-name">${m.icon} ${esc(name)}</span><span class="rep-bar-amt">${fmtEUR(d.totalEUR)}</span></div><div class="rep-bar-track"><div class="rep-bar-fill" style="width:${pct}%;background:${m.color}"></div></div><div class="rep-bar-sub">${d.count} expense${d.count!==1?'s':''} · ${fmtMKD(d.totalMKD)}</div></div>`; }).join(''):'<div style="padding:16px;color:var(--text-3)">No data</div>';

  const monthMap={};
  expenses.forEach(e=>{ if(!e.expenseDate) return; const k=e.expenseDate.slice(0,7); monthMap[k]=monthMap[k]||{totalEUR:0,totalMKD:0,count:0}; monthMap[k].totalEUR+=e.amountEUR||0; monthMap[k].totalMKD+=e.amountMKD||0; monthMap[k].count++; });
  const months=Object.entries(monthMap).sort((a,b)=>b[0]>a[0]?1:-1);
  document.getElementById('rep-months').innerHTML=months.length?months.map(([month,d])=>`<div class="rep-row"><span class="rep-row-name">${fmtMonthLabel(month)}</span><div class="rep-row-right"><div class="rep-row-primary">${fmtEUR(d.totalEUR)}</div><div class="rep-row-secondary">${fmtMKD(d.totalMKD)} · ${d.count} items</div></div></div>`).join(''):'<div style="padding:16px;color:var(--text-3)">No data</div>';

  const supMap={};
  expenses.forEach(e=>{ const k=e.supplierName||'—'; supMap[k]=supMap[k]||{totalEUR:0,totalMKD:0,count:0}; supMap[k].totalEUR+=e.amountEUR||0; supMap[k].totalMKD+=e.amountMKD||0; supMap[k].count++; });
  const sups=Object.entries(supMap).sort((a,b)=>b[1].totalEUR-a[1].totalEUR).slice(0,15);
  document.getElementById('rep-suppliers').innerHTML=sups.length?sups.map(([name,d])=>`<div class="rep-row"><span class="rep-row-name">${esc(name)}</span><div class="rep-row-right"><div class="rep-row-primary">${fmtEUR(d.totalEUR)}</div><div class="rep-row-secondary">${fmtMKD(d.totalMKD)} · ${d.count} items</div></div></div>`).join(''):'<div style="padding:16px;color:var(--text-3)">No data</div>';
}

// ═══════════════════════════════════════════════════════════
//  PROJECTS SCREEN
// ═══════════════════════════════════════════════════════════
function loadProjects(){
  const projects = DB.getProjects();
  const activeId = DB.getActiveProjectId();

  document.getElementById('project-list').innerHTML = projects.map(p => {
    const expenses = DB.getExpenses(p.id);
    const totalEUR = expenses.reduce((a, e) => a + (e.amountEUR || 0), 0);
    const isActive = p.id === activeId;
    const budgetInfo = p.budgetEUR > 0 ? ` · Budget: ${fmtEUR(p.budgetEUR)}` : '';
    return `<div class="project-card ${isActive ? 'active-project' : ''}" data-pid="${p.id}">
      <div class="project-card-icon">🏗️</div>
      <div class="project-card-body">
        <div class="project-card-name">${esc(p.name)}${isActive ? ' ✓' : ''}</div>
        <div class="project-card-meta">${expenses.length} expenses · ${fmtEUR(totalEUR)}${budgetInfo}</div>
      </div>
      <div class="project-card-actions">
        <button class="project-card-edit" data-edit="${p.id}">✏️</button>
      </div>
    </div>`;
  }).join('');

  // Bind card clicks (switch project)
  document.querySelectorAll('.project-card').forEach(card => {
    card.addEventListener('click', () => {
      const pid = parseInt(card.dataset.pid);
      DB.setActiveProjectId(pid);
      updateHeaderProject();
      showScreen('dashboard');
      showToast(`Switched to ${DB.getActiveProject().name}`, 'success');
    });
  });

  // Bind edit buttons — stop propagation so card click doesn't fire too
  document.querySelectorAll('.project-card-edit').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      S.editingProjectId = parseInt(btn.dataset.edit);
      showScreen('project-edit', {});
    });
  });

  // New project button — replace to clear old listeners
  const oldNew = document.getElementById('btn-new-project');
  const freshNew = oldNew.cloneNode(true);
  oldNew.parentNode.replaceChild(freshNew, oldNew);
  freshNew.addEventListener('click', () => {
    S.editingProjectId = null;
    showScreen('project-edit', {});
  });
}

// ═══════════════════════════════════════════════════════════
//  PROJECT EDIT SCREEN
// ═══════════════════════════════════════════════════════════
function loadProjectEdit(){
  const isNew = !S.editingProjectId;
  document.getElementById('hdr-plain-title').textContent = isNew ? 'New Project' : 'Edit Project';
  S.budgetCurrency = 'EUR';

  let proj = null;
  if (!isNew) {
    proj = DB.getProjects().find(p => p.id === S.editingProjectId);
    if (proj) S.budgetCurrency = proj.budgetCurrency || 'EUR';
  }

  // Reset fields every time
  document.getElementById('pe-name').value = proj?.name || '';
  setActiveBudgetCurrency(S.budgetCurrency);
  if (proj && proj.budgetEUR > 0) {
    document.getElementById('pe-budget').value = S.budgetCurrency === 'EUR'
      ? proj.budgetEUR
      : Math.round(proj.budgetEUR * getRate() * 100) / 100;
  } else {
    document.getElementById('pe-budget').value = '';
  }

  // Delete button — rebuild every time
  const delWrap = document.getElementById('pe-delete-wrap');
  if (!isNew) {
    delWrap.innerHTML = `<button id="pe-delete-btn" class="btn-export" style="color:var(--danger);border-color:var(--danger);width:100%;justify-content:center;margin-top:4px">🗑️ Delete Project</button>`;
    document.getElementById('pe-delete-btn').addEventListener('click', () => {
      const projects = DB.getProjects();
      if (projects.length <= 1) { showToast('Cannot delete the last project', 'error'); return; }
      showConfirm('Delete Project', 'All expenses in this project will be permanently deleted.', 'Delete', () => {
        const newProjects = projects.filter(p => p.id !== S.editingProjectId);
        DB.saveProjects(newProjects);
        localStorage.removeItem(`bt_expenses_${S.editingProjectId}`);
        if (DB.getActiveProjectId() === S.editingProjectId) DB.setActiveProjectId(newProjects[0].id);
        updateHeaderProject(); S.editingProjectId = null;
        showToast('Project deleted', 'success'); showScreen('projects');
      });
    });
  } else {
    delWrap.innerHTML = '';
  }

  // ── Replace save button to clear any stale listeners ──
  const oldSave = document.getElementById('pe-save-btn');
  const newSave = oldSave.cloneNode(true);
  oldSave.parentNode.replaceChild(newSave, oldSave);

  newSave.addEventListener('click', () => {
    const name = document.getElementById('pe-name').value.trim();
    if (!name) { showToast('Project name is required', 'error'); return; }
    const budgetRaw = parseFloat(document.getElementById('pe-budget').value) || 0;
    const budgetEUR = budgetRaw > 0
      ? (S.budgetCurrency === 'EUR' ? budgetRaw : Math.round((budgetRaw / getRate()) * 100) / 100)
      : null;
    const projects = DB.getProjects();
    if (isNew) {
      const id = DB.nextId();
      projects.push({ id, name, budgetEUR, budgetCurrency: S.budgetCurrency, createdAt: new Date().toISOString() });
      DB.saveProjects(projects);
      DB.setActiveProjectId(id);
      updateHeaderProject();
      showToast('Project created ✓', 'success');
      showScreen('dashboard');
    } else {
      const idx = projects.findIndex(p => p.id === S.editingProjectId);
      if (idx !== -1) { projects[idx] = { ...projects[idx], name, budgetEUR, budgetCurrency: S.budgetCurrency }; DB.saveProjects(projects); }
      updateHeaderProject();
      showToast('Project saved ✓', 'success');
      showScreen('projects');
    }
  });

  // ── Replace budget currency buttons to clear stale listeners ──
  document.querySelectorAll('.budget-curr-btn').forEach(btn => {
    const fresh = btn.cloneNode(true);
    btn.parentNode.replaceChild(fresh, btn);
  });
  document.querySelectorAll('.budget-curr-btn').forEach(btn => {
    btn.addEventListener('click', () => { S.budgetCurrency = btn.dataset.bcur; setActiveBudgetCurrency(S.budgetCurrency); });
  });
  setActiveBudgetCurrency(S.budgetCurrency);
}

function setActiveBudgetCurrency(cur){
  document.querySelectorAll('.budget-curr-btn').forEach(b=>b.classList.toggle('active',b.dataset.bcur===cur));
}

// ═══════════════════════════════════════════════════════════
//  SETTINGS
// ═══════════════════════════════════════════════════════════
function loadSettings(){
  document.getElementById('s-rate').value=S.settings.exchangeRate||'61.5';
  renderSettingsCategories();
  document.getElementById('s-pin-enabled').checked=S.settings.pinEnabled==='true';
  document.getElementById('s-pin').value=S.settings.pin||'';
  document.getElementById('pin-row').style.opacity=S.settings.pinEnabled==='true'?'1':'.5';
  const kb=DB.storageKB(); const pct=Math.min(100,Math.round(kb/51200*100));
  const fillClass=pct>80?'danger':pct>60?'warn':'';
  document.getElementById('s-storage-info').innerHTML=`<div class="storage-bar-label">Used: ~${kb} KB / ~5000 KB</div><div class="storage-bar-wrap"><div class="storage-bar-track"><div class="storage-bar-fill ${fillClass}" style="width:${pct}%"></div></div></div><div style="margin-top:10px;font-size:12px;color:var(--text-3)">Photos are stored compressed in this browser. Export JSON backup regularly.</div>`;
  const screen=document.getElementById('screen-settings');
  if(screen.dataset.bound) return; screen.dataset.bound='1';
  document.getElementById('s-save-rate').addEventListener('click',()=>{ const rate=parseFloat(document.getElementById('s-rate').value); if(!rate||rate<1){ showToast('Invalid rate','error'); return; } S.settings.exchangeRate=String(rate); DB.saveSettings(S.settings); showToast(`Rate saved: 1 EUR = ${rate} MKD`,'success'); });
  document.getElementById('s-add-cat').addEventListener('click',()=>{ const name=document.getElementById('s-new-cat').value.trim(); if(!name) return; if(S.categories.find(c=>c.name.toLowerCase()===name.toLowerCase())){ showToast('Category already exists','error'); return; } S.categories.push({id:DB.nextId(),name}); DB.saveCategories(S.categories); document.getElementById('s-new-cat').value=''; renderSettingsCategories(); showToast('Category added','success'); });
  document.getElementById('s-pin-enabled').addEventListener('change',e=>{ document.getElementById('pin-row').style.opacity=e.target.checked?'1':'.5'; });
  document.getElementById('s-save-pin').addEventListener('click',()=>{ const enabled=document.getElementById('s-pin-enabled').checked; const pin=document.getElementById('s-pin').value.toString().trim(); if(enabled&&(!pin||pin.length!==4||isNaN(pin))){ showToast('PIN must be exactly 4 digits','error'); return; } S.settings.pin=enabled?pin:''; S.settings.pinEnabled=String(enabled); DB.saveSettings(S.settings); showToast(enabled?'PIN enabled':'PIN disabled','success'); });
  document.getElementById('s-clear-all').addEventListener('click',()=>{
    showConfirm('Clear ALL Data','This will permanently delete ALL projects, expenses, and settings.','Delete All',()=>{
      Object.keys(localStorage).filter(k=>k.startsWith('bt_')).forEach(k=>localStorage.removeItem(k));
      S.settings=DB.getSettings(); S.categories=DB.getCategories();
      updateHeaderProject(); showToast('All data cleared','success'); showScreen('dashboard');
    });
  });
}
function renderSettingsCategories(){
  document.getElementById('s-categories-list').innerHTML=S.categories.map(c=>`<div class="cat-list-item"><span class="cat-list-name">${getCatMeta(c.name).icon} ${esc(c.name)}</span><button class="cat-delete-btn" onclick="deleteCategory(${c.id},'${esc(c.name)}')">✕</button></div>`).join('');
}
window.deleteCategory=function(id,name){ showConfirm('Delete Category',`Delete "${name}"? Existing expenses will remain.`,'Delete',()=>{ S.categories=S.categories.filter(c=>c.id!==id); DB.saveCategories(S.categories); renderSettingsCategories(); showToast('Category deleted','success'); }); };

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
function init(){
  DB.migrate();
  S.settings=DB.getSettings();
  S.categories=DB.getCategories();
  updateHeaderProject();
  initPIN();
  if(S.settings.pinEnabled!=='true'||!S.settings.pin){
    document.getElementById('app').classList.remove('hidden');
    showScreen('dashboard');
  }
}
document.getElementById('bt-quit').addEventListener('click',()=>{
  if(window.self!==window.top){
    try { window.parent.postMessage({ type: 'close-game' }, '*'); } catch(_) {}
  } else {
    location.href='../../';
  }
});
init();
</script>
